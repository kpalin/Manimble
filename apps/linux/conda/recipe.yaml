package:
  name: manimble-linux
  version: 0.1.0

source:
  - path: ../../..
    target_directory: manimble-source
  - url: https://files.pythonhosted.org/packages/47/c6/47b459e043d7b02e1fc59c323fa2e35c5de49e7e9540b623b695ccf25599/manim_slides-5.7.0.tar.gz
    sha256: 571a7bbb8bee1475fb63dd6757470843f807d611d9f9b5baee06086283552e6a
    target_directory: manim-slides-source

build:
  number: 0
  script: bash "$SRC_DIR/manimble-source/apps/linux/conda/build.sh"

requirements:
  host:
    - python >=3.11,<3.14
    - pip
    - setuptools >=69
    - wheel
    - hatchling
    - hatch-fancy-pypi-readme
  run:
    - python >=3.11,<3.14
    - gtk4
    - pygobject >=3.46
    - cairo
    - pango
    - manimpango >=0.6.1,<1
    - pycairo
    - manim ==0.22.1
    - pillow 12.3.*
    - matplotlib 3.11.*
    - python-pptx 1.0.*
    - imageio-ffmpeg 0.6.*
    - av >=9
    - beautifulsoup4 >=4.12.3
    - click >=8.1.3
    - click-default-group >=1.2.2
    - jinja2 >=3.1.2
    - lxml >=4.9.2
    - numpy >=1.19
    - platformdirs >=4
    - pydantic >=2
    - pydantic-extra-types >=2
    - qtpy >=2.4.1
    - requests >=2.28.1
    - rich >=13.3.2
    - rtoml >=0.11
    - tqdm >=4.64.1
    - ffmpeg
    - poppler

about:
  homepage: https://github.com/kpalin/Manimble
  summary: GTK desktop frontend for Manim presentations
  license: MIT

tests:
  - python:
      imports:
        - manim
        - manim_slides
        - manimble
        - manimble_gtk.workspace
  - script:
      - manimble-linux --help
      - python -m pip check
    requirements:
      run:
        - pip
