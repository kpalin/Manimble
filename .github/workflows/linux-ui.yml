name: linux-ui
on:
  push:
  pull_request:

jobs:
  gtk-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GTK and rendering build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg gir1.2-gtk-4.0 libgirepository1.0-dev \
            libcairo2-dev libpango1.0-dev pkg-config poppler-utils python3-dev x11-utils \
            xdotool xvfb
      - name: Install Manimble
        run: python -m pip install .
      - name: Test working-copy behavior
        run: python -m unittest tests.test_linux_workspace -v
      - name: Exercise the UI under Xvfb
        env:
          MANIMBLE_UI_ARTIFACTS: ${{ runner.temp }}/manimble-ui-smoke
        run: env -u DISPLAY bash tests/linux_ui_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ui-screenshots
          path: ${{ runner.temp }}/manimble-ui-smoke
          if-no-files-found: ignore
