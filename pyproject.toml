[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manimble-linux"
version = "0.1.0"
description = "Linux desktop frontend for Manimble"
readme = "apps/linux/README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyGObject>=3.46",
    "manim==0.21.0",
    "manim-slides==5.7.0",
    "Pillow==12.3.0",
    "matplotlib==3.11.2",
    "python-pptx==1.0.2",
    "biocartoon==0.4.3",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
manimble-linux = "manimble_gtk.app:main"

[tool.setuptools]
packages = ["manimble", "manimble_gtk"]
package-dir = { manimble = "engine/manimble", manimble_gtk = "apps/linux/manimble_gtk" }
include-package-data = true

[tool.setuptools.package-data]
manimble = ["themes/*.py", "themes/README.md"]
